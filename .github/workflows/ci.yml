name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      update_playwright_snapshots:
        description: >-
          Regenerate the storefront visual baselines on this runner and upload
          them as an artifact. Visual snapshots are platform-specific, so they
          can only be produced by the environment that asserts against them —
          a developer machine, even a Linux one, renders fonts differently.
        type: boolean
        default: false

# Cancel in-progress runs for the same ref on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Rust – format / clippy / test / audit
  # ────────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust checks & tests
    runs-on: windows-latest
    # This job builds and tests on windows-latest deliberately — that is the
    # platform that ships — and Windows is the slow one. Measured: the steps
    # before the tests (cargo-deny, cargo-audit, the sidecar install, the
    # storefront build, check, fmt, clippy) take roughly half an hour between
    # them, nextest another twenty-odd minutes for 1004 tests, and
    # `cargo test --doc` compiles the crate again on top of that.
    #
    # 30 was cancelled mid-test at 30:14, and 60 was cancelled at 60:00 during
    # the doc-test compile with everything before it green. This is a ceiling
    # for catching a hang, not a target, and it changes nothing about what the
    # job verifies.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install checksum-verified cargo-deny 0.20.2
        shell: pwsh
        run: |
          $version = "0.20.2"
          $target = "x86_64-pc-windows-msvc"
          $archiveName = "cargo-deny-$version-$target.tar.gz"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $extractDir = Join-Path $env:RUNNER_TEMP "cargo-deny-$version"
          $expectedSha256 = "975A22143262FD27476D19EE00C7AF67978426E40E1DEE94EED6BBADE1CF87DC"
          $url = "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$archiveName"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "cargo-deny archive checksum mismatch: expected $expectedSha256, got $actualSha256"
          }

          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          tar -xzf $archive -C $extractDir
          $cargoDeny = Join-Path $extractDir "cargo-deny-$version-$target/cargo-deny.exe"
          & $cargoDeny --version
          "CARGO_DENY=$cargoDeny" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cargo dependency policy
        working-directory: src-tauri
        shell: pwsh
        run: '& $env:CARGO_DENY check'

      - name: Install cargo-audit 0.22.1
        run: cargo install cargo-audit --version 0.22.1 --locked --quiet

      - name: Cargo audit (whole lockfile)
        # Reads the single exact exemption from src-tauri/.cargo/audit.toml.
        # Whole-lock scanning complements cargo-deny's active feature graph.
        working-directory: src-tauri
        run: cargo audit --file Cargo.lock

      # tauri.conf.json bundles the sidecar's node_modules as an application
      # resource, so the Tauri build script aborts with "resource path
      # sidecar\whatsapp-sidecar\node_modules doesn't exist" before a single
      # line of Rust is checked. The frontend job has always installed it; this
      # job never did. It went unnoticed because the cargo-deny and cargo-audit
      # steps ahead of it were failing first — nothing had reached cargo check.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src-tauri/sidecar/whatsapp-sidecar/package-lock.json

      # tauri.conf.json declares four bundled resources, and the Tauri build
      # script refuses to run until each exists. `beforeBuildCommand` creates
      # them — but it only runs on `tauri build`, never on `cargo check`, which
      # still invokes that build script. So this job could never compile on a
      # clean machine; it only ever passed locally, on developer checkouts where
      # a previous `npm run ship` had left the files behind.
      #
      # These steps reproduce `beforeBuildCommand` exactly, in its order, so the
      # gate depends on nothing left over from an earlier build.
      - name: Install WhatsApp sidecar dependencies
        working-directory: src-tauri/sidecar/whatsapp-sidecar
        run: npm ci

      # node.exe is gitignored (~92 MB) and no script in the repo fetched it,
      # so a fresh clone had no way to produce it. This is the project's own
      # provisioning command from beforeBuildCommand: the sidecar runs whatever
      # Node is copied here, and setup-node above pins that to 20.
      - name: Provision the sidecar Node runtime
        working-directory: src-tauri/sidecar/whatsapp-sidecar
        run: node -e "require('fs').copyFileSync(process.execPath,'node.exe')"

      - name: Build the storefront (bundled as an app resource)
        working-directory: storefront
        run: npm ci && npm run build

      - name: Cargo check
        # Mirrors scripts/ship.mjs's Rust gate exactly (plain `cargo check`, no
        # extra flags) so CI fails on the same thing the local ship gate fails
        # on, before the slower fmt/clippy/test steps below run.
        working-directory: src-tauri
        run: cargo check

      - name: Cargo fmt (check only)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # `cargo test --all-targets` used to run here as well. It executed exactly
      # the same set as the nextest step below — the whole suite, compiled and
      # run twice — and nextest is the one that emits the JUnit report. Doc-tests
      # are the only thing nextest does not cover, and they have their own step.
      # Coverage is unchanged; the job stops doing the work twice, which is what
      # was pushing it past its timeout on windows-latest.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.109

      - name: Cargo nextest (JUnit + slow-test reporting)
        working-directory: src-tauri
        run: cargo nextest run --all-targets --profile ci 2>&1
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: 1

      - name: Cargo doc-tests (retained outside nextest)
        working-directory: src-tauri
        run: cargo test --doc

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Frontend – type-check / lint / unit tests / npm audit
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend checks & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src-tauri/sidecar/whatsapp-sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tsc cannot see this class: SessionToken is assignable to string, so a
      # binding forwarding the token under the old actor_user_id key compiles
      # clean and fails only at runtime on the till.
      - name: Tauri invoke contract
        run: python scripts/check_invoke_contract.py --root .

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Vitest unit tests
        run: npm test

      - name: Vitest coverage (informational — target 80%)
        run: npm run coverage || true
        # Target threshold is 80 / 80 / 80 (see vitest.config.ts).
        # Kept informational (|| true) until @testing-library/react component
        # tests are added to bring line/function/branch coverage to target.
        # Remove || true to enforce when coverage reaches threshold.

      - name: npm audit (all dependencies)
        # Vitest and its Vite toolchain run in CI and can expose local files when
        # vulnerable, so dev dependencies stay inside the enforced gate. The
        # severity floor is unchanged; what the wrapper adds is a named, dated
        # exception list, because every remaining advisory here traces to
        # extract-zip, which is unpatched in every published version. It also
        # fails when an exception stops being needed, so the list cannot rot
        # into blanket suppression. See scripts/check-npm-audit.mjs.
        run: node scripts/check-npm-audit.mjs --level high

      - name: Install WhatsApp sidecar dependencies
        working-directory: src-tauri/sidecar/whatsapp-sidecar
        run: npm ci

      - name: Audit WhatsApp sidecar dependencies
        # The sidecar ships inside the installer and runs on the till, so this
        # one has no exceptions at all.
        run: node scripts/check-npm-audit.mjs --dir src-tauri/sidecar/whatsapp-sidecar --level high

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Storefront – type-check (separate npm workspace, own lockfile)
  # ────────────────────────────────────────────────────────────────────────────
  storefront:
    name: Storefront type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install storefront dependencies
        working-directory: storefront
        run: npm ci

      - name: TypeScript type-check
        # storefront uses `typecheck` (no hyphen); the root package uses
        # `type-check` (hyphenated) — see scripts/ship.mjs. Not a typo.
        working-directory: storefront
        run: npm run typecheck

      - name: Unit tests
        working-directory: storefront
        run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # 3b. Storefront Playwright E2E
  # ────────────────────────────────────────────────────────────────────────────
  storefront-e2e:
    name: Storefront Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [storefront]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install storefront dependencies
        working-directory: storefront
        run: npm ci

      - name: Install Playwright browsers
        working-directory: storefront
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        if: ${{ inputs.update_playwright_snapshots != true }}
        working-directory: storefront
        run: npm run test:e2e

      # Baselines can only be minted by the runner that checks them. Run this
      # workflow manually with the input set, download `playwright-snapshots`,
      # and commit its contents.
      - name: Regenerate visual baselines
        if: ${{ inputs.update_playwright_snapshots == true }}
        working-directory: storefront
        run: npx playwright test --update-snapshots

      - name: Upload regenerated baselines
        if: ${{ inputs.update_playwright_snapshots == true }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: storefront/tests/e2e/**/*-snapshots/
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: storefront/playwright-report/

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Semgrep – focused custom SAST policy
  # ────────────────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep security policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Semgrep 1.172.0
        run: python -m pip install --disable-pip-version-check --no-cache-dir semgrep==1.172.0

      - name: Validate finite Semgrep security exceptions
        run: python scripts/validate_semgrep_exceptions.py --root . --fixtures tests/security/semgrep/test-validators/authorized-exceptions-fixtures.json --self-test

      - name: Test custom Semgrep rules
        run: semgrep --test --config config tests/security

      - name: Enforce custom Semgrep policy
        run: |
          python scripts/validate_semgrep_exceptions.py --root .
          semgrep scan --timeout 600 --error --config config/semgrep src src-tauri/src src-tauri/tauri.conf.json storefront .github

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Gitleaks — secret detection (working tree + PR range)
  # ────────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks 8.30.1 (checksum-verified)
        run: |
          GITLEAKS_VERSION="8.30.1"
          # From the release's own gitleaks_8.30.1_checksums.txt. The previous
          # value matched no published asset, so the install failed the checksum
          # and the scan never ran — a secret gate that was silently not a gate.
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # gitleaks `detect` takes a single --source; repeating the flag does not
      # union the paths, the last one silently wins. This step used to pass
      # seven, so it scanned only `scripts/` — 152 KB of a multi-megabyte
      # repository — and reported "no leaks found" without ever reading src/,
      # src-tauri/, storefront/, .github/, config/ or tests/. One scan per
      # directory is what the original list was trying to express; `bash -e`
      # stops the job on the first directory that reports a leak.
      - name: Run Gitleaks working-tree scan (uncommitted files)
        run: |
          for dir in src src-tauri storefront .github config tests scripts; do
            echo "--- scanning ${dir}"
            ./gitleaks detect --config config/gitleaks.toml --no-git --redact --source "${dir}"
          done

      # The positive fixtures are allowlisted out of the scans above, so this
      # asserts detection is still live rather than trusting that it is: scan
      # them with gitleaks' own default rules and require a non-zero exit.
      # A clean result here means the scanner has stopped detecting anything.
      - name: Prove the scanner still detects planted secrets
        run: |
          if ./gitleaks detect --no-git --redact --source tests/security/gitleaks-fixtures; then
            echo "::error::gitleaks reported no leaks in the positive fixtures — detection is broken"
            exit 1
          fi
          echo "Positive fixtures still trigger detection."

      - name: Run Gitleaks commit-range scan (PR only)
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Skipping commit-range scan: base SHA is empty"
            exit 0
          fi
          echo "Scanning commits from $BASE_SHA to $HEAD_SHA"
          ./gitleaks detect --config config/gitleaks.toml --redact --log-opts="${BASE_SHA}..${HEAD_SHA}"

  # ────────────────────────────────────────────────────────────────────────────
  # 6. Tauri build (debug) – confirms the full app compiles end-to-end
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Tauri build check
    runs-on: windows-latest
    needs: [rust, frontend, storefront, semgrep, gitleaks]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      # Compile-only. tauri-action@v0 is deliberately NOT used here: it bundles
      # an installer and, given a token, can publish a release — the project
      # rule is that installers come only from tagged, green commits, never
      # from an ordinary push. `cargo build` proves the app links end-to-end,
      # which is all this job is for.
      - name: Build frontend bundle
        run: npm run build

      # tauri.conf.json bundles ../storefront/dist as an app resource, so the
      # build script fails with "resource path doesn't exist" without it. The
      # Rust job builds the storefront for the same reason; this job was missing
      # the step, which only became visible once it started running at all.
      - name: Build the storefront (bundled as an app resource)
        working-directory: storefront
        run: npm ci && npm run build

      # The sidecar is a bundled resource too, and its node.exe is provisioned
      # rather than committed.
      - name: Install WhatsApp sidecar dependencies
        working-directory: src-tauri/sidecar/whatsapp-sidecar
        run: npm ci --omit=dev

      - name: Provision the sidecar Node runtime
        working-directory: src-tauri/sidecar/whatsapp-sidecar
        run: node -e "require('fs').copyFileSync(process.execPath,'node.exe')"

      - name: Tauri app compiles (no installer bundled)
        working-directory: src-tauri
        run: cargo build

  # ────────────────────────────────────────────────────────────────────────────
  # 6. Release gate – runs only on main/master; summarises remaining manual gates
  # ────────────────────────────────────────────────────────────────────────────
  release-gate:
    name: Release gate summary
    runs-on: ubuntu-latest
    # storefront-e2e is included because this job asserts it passed. A summary
    # that prints PASSED for a job it never waited on is worse than no summary:
    # it reports a result it cannot possibly know.
    needs: [rust, frontend, storefront, storefront-e2e, semgrep, gitleaks, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: All automated release gate checks passed
        run: |
          echo "✅ Cargo check (src-tauri compiles):          PASSED"
          echo "✅ Rust unit + integration tests:             PASSED"
          echo "✅ TypeScript type-check:                    PASSED"
          echo "✅ ESLint (0 warnings):                      PASSED"
          echo "✅ Vitest frontend tests:                     PASSED"
          echo "✅ Storefront type-check:                    PASSED"
          echo "✅ Storefront Playwright E2E (built bundle): PASSED"
          echo "✅ Semgrep security policy:                  PASSED"
          echo "✅ Gitleaks secret scan:                     PASSED"
          echo "✅ Cargo dependency security audit:          PASSED"
          echo "✅ Tauri debug build:                        PASSED"
          echo ""
          # These four were on the manual list until the code that closes them
          # landed. They are kept here, named, rather than deleted: a gate that
          # vanishes silently is indistinguishable from one that was skipped.
          echo "Closed in code — re-verify only if the cited site changes:"
          echo "  P0 • upsert_rows Supabase REST idempotency"
          echo "       Prefer: resolution=merge-duplicates — sync_v2/client.rs, covered by hub/rest_tests.rs"
          echo "  P1 • Permanently-failed sync event alerting"
          echo "       dead_letter::pending_count -> 'sync.quarantined_rows' (Critical) in system_health_commands.rs"
          echo "  P2 • Atomic receipt number sequence (no gap on crash)"
          echo "       UPDATE ... RETURNING next_receipt_seq - 1 in sale_repo.rs;"
          echo "       invariant test the_receipt_sequence_has_no_gaps_across_sales_and_refunds"
          echo "  P2 • Multi-device stock reconciliation query"
          echo "       ledger-vs-cache drift -> 'stock.ledger_mismatch' in system_health_commands.rs."
          echo "       The query runs on demand from the health check; scheduling it nightly is still ops work."
          echo ""
          echo "Manual gates still required before production — no code can close these:"
          echo "  P0 • Backup/restore drill on real retail hardware (sign-off template: docs/backup-restore-ops.md)"
          echo "  P0 • Receipt VAT breakdown + TRN review by finance/tax adviser"
          echo "       Review pack and sign-off: docs/vat-receipt-review.md"
          echo "       The VAT defect that pack found — a whole-bill discount"
          echo "       applied after line tax — is fixed. The adviser still has to"
          echo "       ratify the apportionment basis (pro rata across all lines)"
          echo "       and decide whether pre-fix sales need correcting."
          echo "  P0 • Card terminal PCI P2PE certificate on file"
          echo "  P0 • BitLocker enabled on all POS hardware"
