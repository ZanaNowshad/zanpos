name: Dependency diagnostics

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  dependency-diagnostics:
    name: Capture dependency gate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Generate and verify Rust remediation candidate
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cp Cargo.lock ../Cargo.lock.before
          set +e
          cargo deny check > ../cargo-deny-before.log 2>&1
          echo "$?" > ../cargo-deny-before-exit.txt
          set -e
          cargo update -p rustls --precise 0.23.45
          cp Cargo.lock ../Cargo.lock.candidate
          set +e
          cargo deny check > ../cargo-deny-after.log 2>&1
          echo "$?" > ../cargo-deny-after-exit.txt
          set -e
          cat ../cargo-deny-after.log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Capture npm candidate-generation diagnostics
        shell: bash
        run: |
          set +e
          cp package.json package.json.before
          cp package-lock.json package-lock.before.json
          : > npm-generation.log

          npm pkg set 'overrides.basic-ftp=6.2.1' 'overrides.braces=3.0.4' >> npm-generation.log 2>&1
          pkg_status=$?
          echo "$pkg_status" > npm-pkg-set-exit.txt

          if [ "$pkg_status" -eq 0 ]; then
            npm install --package-lock-only --save-dev \
              @wdio/cli@^9.31.8 \
              @wdio/local-runner@^9.31.8 \
              @wdio/mocha-framework@^9.31.8 \
              @wdio/spec-reporter@^9.31.8 \
              webdriverio@^9.31.8 \
              @wdio/tauri-service@^1.4.0 >> npm-generation.log 2>&1
            install_status=$?
          else
            install_status=125
          fi
          echo "$install_status" > npm-install-exit.txt

          if [ "$install_status" -eq 0 ]; then
            npm audit fix --package-lock-only >> npm-generation.log 2>&1
            audit_fix_status=$?
            cp package.json package.json.candidate
            cp package-lock.json package-lock.candidate.json
          else
            audit_fix_status=125
          fi
          echo "$audit_fix_status" > npm-audit-fix-exit.txt
          cat npm-generation.log
          exit 0

      - name: Verify npm audit candidate
        if: ${{ hashFiles('package-lock.candidate.json') != '' }}
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-after.json
          echo "$?" > npm-audit-after-exit.txt
          node scripts/check-npm-audit.mjs --level high > npm-audit-wrapper-after.log 2>&1
          echo "$?" > npm-audit-wrapper-after-exit.txt
          set -e
          cat npm-audit-wrapper-after.log

      - name: Verify frontend candidate
        if: ${{ hashFiles('package-lock.candidate.json') != '' }}
        shell: bash
        run: |
          set -o pipefail
          npm ci
          npm run type-check
          npm run lint
          npm run test
          npm run build
          npx wdio --version

      - name: Upload dependency remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-candidate
          if-no-files-found: error
          path: |
            Cargo.lock.before
            Cargo.lock.candidate
            cargo-deny-before.log
            cargo-deny-before-exit.txt
            cargo-deny-after.log
            cargo-deny-after-exit.txt
            package.json.before
            package.json.candidate
            package-lock.before.json
            package-lock.candidate.json
            npm-generation.log
            npm-pkg-set-exit.txt
            npm-install-exit.txt
            npm-audit-fix-exit.txt
            npm-audit-after.json
            npm-audit-after-exit.txt
            npm-audit-wrapper-after.log
            npm-audit-wrapper-after-exit.txt
