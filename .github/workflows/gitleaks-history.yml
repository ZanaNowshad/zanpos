name: Gitleaks full-history scan

on:
  schedule:
    # Weekly: midnight Sunday UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  history-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks 8.30.1 (checksum-verified)
        run: |
          GITLEAKS_VERSION="8.30.1"
          # SHA-256 for gitleaks_8.30.1_linux_x64.tar.gz from the official release assets.
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Run full-history Gitleaks scan
        # Git history mode (no --no-git): scans every commit reachable from HEAD
        # --redact prevents accidental secret exposure in CI logs
        run: |
          ./gitleaks detect --config config/gitleaks.toml --redact --report-format json --report-path gitleaks-report.json

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-report.json
          if-no-files-found: error
