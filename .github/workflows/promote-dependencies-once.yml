name: One-shot verified dependency promotion

on:
  push:
    branches:
      - agent/harden-seed-cashier

jobs:
  promote:
    if: >-
      github.repository == 'ZanaNowshad/zanpos' &&
      github.ref == 'refs/heads/agent/harden-seed-cashier' &&
      github.actor == 'ZanaNowshad' &&
      github.event.head_commit.message == 'ci: stage verified dependency promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-seed-cashier
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate and verify package-manager candidates
        shell: bash
        run: |
          set -euo pipefail

          npm pkg set 'overrides.basic-ftp=6.2.1'
          npm install --package-lock-only --ignore-scripts --save-dev \
            @wdio/cli@^9.31.8 \
            @wdio/local-runner@^9.31.8 \
            @wdio/mocha-framework@^9.31.8 \
            @wdio/spec-reporter@^9.31.8 \
            webdriverio@^9.31.8 \
            @wdio/tauri-service@^1.4.0

          set +e
          npm audit fix --package-lock-only --ignore-scripts
          audit_fix_status=$?
          set -e
          echo "npm audit fix exit: $audit_fix_status (non-zero is expected while reviewed unpatched advisories remain)"

          (
            cd src-tauri
            cargo update -p rustls --precise 0.23.45
            cargo metadata --locked --format-version 1 > /dev/null
          )

          cat > /tmp/dependency-candidates.sha256 <<'EOF'
          cf742a4cd95ad3467b20293beff094da4dd8efe6c069c698313fb9c0a67d3365  package.json
          7965fca7e989dde8bebeafb13f09e7218f8a2aa783462f85a3c05426265f2085  package-lock.json
          a4aee2526d0a533a04717b2b7b64d33943a947afc53acdba6918c7632dbf47c7  src-tauri/Cargo.lock
          EOF
          sha256sum -c /tmp/dependency-candidates.sha256

      - name: Add finite braces audit exception
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/check-npm-audit.mjs")
          text = path.read_text(encoding="utf-8")

          doc_start = text.index("/**")
          doc_end = text.index("*/", doc_start) + 2
          new_doc = '''/**
           * `npm audit`, but with reviewed exceptions instead of a lower bar.
           *
           * The enforced severity floor stays at `high`. Two roots in the root
           * WebdriverIO/Tauri e2e toolchain are temporarily accepted because no patched
           * release exists: `extract-zip` via `@puppeteer/browsers`, and `braces` via
           * `@wdio/mocha-framework` → `mocha` → `chokidar`.
           *
           * These are root devDependencies used by the desktop e2e harness and are not
           * bundled into the Tauri installer. The production bundle contains built
           * frontend/storefront assets plus the independently audited WhatsApp sidecar.
           * Forced npm fixes would instead install breaking WebdriverIO downgrades.
           *
           * An exception only covers paths whose actual advisory root is named below.
           * Any other high/critical root still fails, and an exception becomes stale as
           * soon as its advisory disappears from a dependency tree where it is present.
           *
           * Usage: node scripts/check-npm-audit.mjs [--dir <path>] [--level high]
           */'''
          text = text[:doc_start] + new_doc + text[doc_end:]

          needle = '''const ACCEPTED = {
            "extract-zip": {
          '''
          replacement = '''const ACCEPTED = {
            "braces": {
              why:
                "GHSA-vfj7-8cjw-p6xm affects every published braces release through 3.0.3 " +
                "and GitHub lists no patched version. Reached only through " +
                "@wdio/mocha-framework → mocha → chokidar in the root WebdriverIO Tauri " +
                "e2e harness. Those root devDependencies are not bundled by Tauri; the " +
                "production bundle contains built frontend/storefront assets and the " +
                "separately audited WhatsApp sidecar, not this Mocha toolchain.",
              review: "2026-12-01",
            },
            "extract-zip": {
          '''
          if text.count(needle) != 1:
              raise SystemExit("expected ACCEPTED insertion point was not found exactly once")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY

      - name: Verify audit policy and exact change set
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/check-npm-audit.mjs --level high
          git diff --check

          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          package-lock.json
          package.json
          scripts/check-npm-audit.mjs
          src-tauri/Cargo.lock
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/harden-seed-cashier
          test "$(git rev-parse origin/agent/harden-seed-cashier)" = "$GITHUB_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts/check-npm-audit.mjs src-tauri/Cargo.lock
          git commit -m "security: remediate npm and rust dependency advisories"
          git push origin HEAD:agent/harden-seed-cashier
