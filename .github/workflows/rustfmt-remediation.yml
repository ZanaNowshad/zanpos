name: One-shot rustfmt remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/harden-seed-cashier'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: agent/harden-seed-cashier
          fetch-depth: 0

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Generate and validate formatter-only delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

          mapfile -t changed < <(git diff --name-only)
          printf 'rustfmt changed files:\n'
          printf '  %s\n' "${changed[@]}"

          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "src-tauri/src/db/repositories/auth_repo.rs" ]; then
            echo "Refusing to push: expected rustfmt to change only auth_repo.rs" >&2
            git diff --stat
            exit 1
          fi

          git diff --check
          git diff -- src-tauri/src/db/repositories/auth_repo.rs

      - name: Commit formatter output with fast-forward lease
        shell: bash
        run: |
          set -euo pipefail
          expected_remote="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db/repositories/auth_repo.rs
          git commit -m "style: apply rustfmt to auth hardening tests"
          git push --force-with-lease=refs/heads/agent/harden-seed-cashier:${expected_remote} origin HEAD:refs/heads/agent/harden-seed-cashier
