# Gitleaks configuration for ZANPOS
# v8.30.1 — MIT license — https://github.com/gitleaks/gitleaks
#
# Owner: ZANPOS Maintainers
# Review/expiry: 2027-01-31

title = "ZANPOS Gitleaks secret detection"

[extend]
useDefault = true

# ── Allowlist: documented non-secret paths / patterns ─────────────
# Every entry documents: path/regex, reason, owner, review date (≤ 2027-01-31).

[allowlist]
description = "Lockfiles, deterministic test data, and safe structural patterns"
regexes = [
  # npm integrity hashes (lockfile structural content, not secrets)
  '''"integrity":\s*"sha(?:256|384|512)-[A-Za-z0-9+/=]+"''',

  # Argon2id password hashes (deterministic, non-reversible)
  '''\$argon2id\$[^\s"']+''',

  # SQLite local file path (not a network credential)
  '''sqlite:[/\\][/\\][^\s"']+\.db''',

  # cargo-deny / checksum verification hex strings
  '''^(checksum|digest|hash|value)\s*=\s*"[a-f0-9]{40,}"''',

  # plaintext-PIN — test assertions and numeric barcodes
  '''(?:assert|test|expect|should|must_eq|pin_hash).*["']?\d{4,6}["']?''',
]
paths = [
  # lockfiles and example configs
  '''package-lock\.json$''',
  '''\.env\.example$''',
  '''Snap[/\\]''',

  # initial migration — contains deterministic admin seed data
  '''migrations[/\\]0001_initial\.sql$''',

  # license verification test data — synthetic Ed25519 signatures only
  # reason: deterministic test vectors, zero-value test keys
  # Owner: ZANPOS Maintainers. Review by: 2027-01-31.
  '''src-tauri[/\\]src[/\\]license[/\\]verify\.rs''',

  # synthetic gitleaks test fixtures that must pass (NOT the positive fixtures)
  # The positive fixtures (gitleaks-fixtures/) MUST still trigger detection.
  # reason: RED/GREEN gitleaks test coverage for allowed patterns
  # Owner: ZANPOS Maintainers. Review by: 2027-01-31.
  '''tests[/\\]security[/\\]gitleaks[/\\]''',

  # bundle.cjs: compiled baileys WhatsApp Web library artifact (8.9 MB).
  # Contains embedded Firebase API-key constants (AIzaSy...) from
  # @whiskeysockets/baileys — these are third-party library configuration
  # strings, NOT ZANPOS credentials. The pattern appears in minified
  # JavaScript bundle code and cannot be narrowed to a single fingerprint.
  # Owner: ZANPOS Maintainers. Review by: 2027-01-31.
  '''src-tauri[/\\]sidecar[/\\]whatsapp-sidecar[/\\]bundle\.cjs''',
]

# ── Custom rules for ZANPOS-specific secret patterns ──────────────
# Owner: ZANPOS Maintainers. Review by: 2027-01-31.

[[rules]]
id = "zanpos-supabase-key"
description = "Supabase anon/service_role key leaked in source or config"
regex = '''(?:sbp_|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.)[a-zA-Z0-9_-]{20,}'''
tags = ["zanpos", "supabase", "key"]

[[rules]]
id = "zanpos-ai-provider-key"
description = "AI provider API key (OpenAI, Anthropic, Gemini, etc.) leaked in source"
regex = '''(?i)(?:sk-(?:ant|proj)-[a-zA-Z0-9]{32,}|AIzaSy[A-Za-z0-9_-]{33}|xai-[a-zA-Z0-9]{32,}|sk-ant-api[0-9]{2}-[a-zA-Z0-9_-]{48,})'''
tags = ["zanpos", "ai", "key"]

[[rules]]
id = "zanpos-whatsapp-session"
description = "WhatsApp session or auth material placed in source"
regex = '''(?i)(?:whatsapp|baileys|wa_session|wa_auth)[\s:"'=]+[a-zA-Z0-9+/=]{40,}'''
tags = ["zanpos", "whatsapp", "session"]

[[rules]]
id = "zanpos-updater-private-key"
description = "Tauri updater or code-signing private key material in source"
regex = '''(?m)^-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'''
tags = ["zanpos", "signing", "private-key"]

[[rules]]
id = "zanpos-store-pairing-token"
description = "Hub pairing or store-authentication token leaked in source"
regex = '''(?i)(?:pairing[_-]token|store[_-]secret|hub[_-]secret)[\s:"'=]+[a-zA-Z0-9+/=]{32,}'''
tags = ["zanpos", "pairing", "token"]

[[rules]]
id = "zanpos-csp-report-uri"
description = "CSP report-uri pointing to an external collector containing a key or token"
regex = '''report-uri\s+https?://[^\s;"]+[?&](?:token|key|api[_-]?key)=[^\s;"]+'''
tags = ["zanpos", "csp", "leak"]

[[rules]]
id = "zanpos-explicit-plaintext-pin"
description = "Hardcoded plaintext PIN — ZANPOS uses Argon2id; literal 4-6 digit PIN must never appear"
regex = '''(?i)(?:pin|passcode|pincode)\s*[:=]\s*["']?\d{4,6}["']?'''
tags = ["zanpos", "pin", "plaintext"]
