rules:
  - id: zanpos-tauri-mutation-requires-rbac
    languages: [rust]
    severity: ERROR
    message: Tauri mutation commands must validate the caller with an RBAC helper before each mutation sink.
    metadata:
      category: security
      technology: [rust, tauri, sqlx]
      baseline:
        structural_constraint: The only bootstrap baseline is the exact setup_pull_catalog watermark-delete expression; every other SQL mutation requires an ordered RBAC call correlated to that same sink.
        rationale: A later RBAC call cannot authorize an earlier write, and the exact bootstrap sink exception cannot suppress a different or newly added sink before the setup guard.
        owner: ZANPOS Maintainers
        review_by: '2027-01-31'
    paths:
      include:
        - /src-tauri/src/commands/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    patterns:
      - pattern-inside: |
          #[tauri::command]
          pub async fn $FUNC(...) {
            ...
          }
      - pattern: sqlx::query($QUERY).execute(...).await?
      - metavariable-regex:
          metavariable: $FUNC
          regex: '.*(?:create|update|delete|void|dismiss|resolve|adjust|close|open|apply|add|rollback|checkout|approve|execute|sync|receive|import|save|set|record).*'
      - pattern-not-inside: |
          rbac::$CHECK(...).await?;
          ...
          sqlx::query($QUERY).execute(...).await?
      - pattern-not-inside: |
          let $AUTH = rbac::$CHECK(...).await?;
          ...
          sqlx::query($QUERY).execute(...).await?
      - pattern-not-inside: |
          crate::commands::rbac::$CHECK(...).await?;
          ...
          sqlx::query($QUERY).execute(...).await?
      - pattern-not-inside: |
          let $AUTH = crate::commands::rbac::$CHECK(...).await?;
          ...
          sqlx::query($QUERY).execute(...).await?
      - pattern-not-inside: |
          sqlx::query("DELETE FROM app_config WHERE key LIKE 'sync_v2_watermark_%'")
            .execute(...)
            .await?
  - id: zanpos-tauri-repository-mutation-requires-rbac
    languages: [rust]
    severity: ERROR
    message: Tauri commands invoking mutation repository helpers must validate RBAC first.
    metadata:
      baseline:
        structural_constraint: Imported and locally aliased paths resolve to the full sink. Wrapper calls use the finite persist_*_wrapper, *_mutation, or *_write convention. Branch exceptions end at delivery_update_status/shift_close. Nested AI exceptions repeat the exact authorized create_undo_record, expire_old_actions, create_session, save_message, and end_session expressions.
        rationale: Every ordered negative repeats the same sink, and every nested exception matches only its reviewed expression. A later/unrelated RBAC call, a new sink before authorization, or a different future sink therefore remains visible.
        owner: ZANPOS Maintainers
        review_by: '2027-01-31'
    paths:
      include:
        - /src-tauri/src/commands/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    patterns:
      - pattern-inside: |
          #[tauri::command]
          pub async fn $FUNC(...) {
            ...
          }
      - pattern-either:
          - patterns:
              - pattern: crate::db::repositories::$REPO::$METHOD(...)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: '.*_repo$'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: '.*(?:insert|update|delete|create|close|open|rollback|void|approve|execute|apply|add|checkout|receive|resume|sync|dismiss|resolve|mark|cancel|expire|end|finalize|merge|confirm|revert|clear|submit|save|set|record).*'
              - pattern-not-inside: |
                  rbac::$CHECK(...).await?;
                  ...
                  $REPO::$METHOD(...)
              - pattern-not-inside: |
                  rbac::$CHECK(...).await?;
                  ...
                  crate::db::repositories::$REPO::$METHOD(...)
              - pattern-not-inside: |
                  let $AUTH = rbac::$CHECK(...).await?;
                  ...
                  $REPO::$METHOD(...)
              - pattern-not-inside: |
                  let $AUTH = rbac::$CHECK(...).await?;
                  ...
                  crate::db::repositories::$REPO::$METHOD(...)
              - pattern-not-inside: |
                  crate::commands::rbac::$CHECK(...).await?;
                  ...
                  $REPO::$METHOD(...)
              - pattern-not-inside: |
                  crate::commands::rbac::$CHECK(...).await?;
                  ...
                  crate::db::repositories::$REPO::$METHOD(...)
              - pattern-not-inside: |
                  let $AUTH = crate::commands::rbac::$CHECK(...).await?;
                  ...
                  $REPO::$METHOD(...)
              - pattern-not-inside: |
                  let $AUTH = crate::commands::rbac::$CHECK(...).await?;
                  ...
                  crate::db::repositories::$REPO::$METHOD(...)
              - pattern-not-inside: |
                  authorize_office(...).await?;
                  ...
                  $REPO::$METHOD(...)
              - pattern-not-inside: |
                  authorize_office(...).await?;
                  ...
                  crate::db::repositories::$REPO::$METHOD(...)
              - pattern-not-inside: |
                  let $AUTH = authorize_office(...).await?;
                  ...
                  $REPO::$METHOD(...)
              - pattern-not-inside: |
                  let $AUTH = authorize_office(...).await?;
                  ...
                  crate::db::repositories::$REPO::$METHOD(...)
              - pattern-not-inside: |
                  authorize_office(...).await.map_err(...)?;
                  ...
                  $REPO::$METHOD(...)
              - pattern-not-inside: |
                  authorize_office(...).await.map_err(...)?;
                  ...
                  crate::db::repositories::$REPO::$METHOD(...)
              - pattern-not-inside: |
                  let $AUTH = authorize_office(...).await.map_err(...)?;
                  ...
                  $REPO::$METHOD(...)
              - pattern-not-inside: |
                  let $AUTH = authorize_office(...).await.map_err(...)?;
                  ...
                  crate::db::repositories::$REPO::$METHOD(...)
          - patterns:
              - pattern: $WRAPPER(...)
              - metavariable-regex:
                  metavariable: $WRAPPER
                  regex: '(?:persist_[a-zA-Z0-9_]+_wrapper|[a-zA-Z0-9_]+_(?:mutation|write))'
              - pattern-not-inside: |
                  rbac::$CHECK(...).await?;
                  ...
                  $WRAPPER(...)
              - pattern-not-inside: |
                  let $AUTH = rbac::$CHECK(...).await?;
                  ...
                  $WRAPPER(...)
              - pattern-not-inside: |
                  crate::commands::rbac::$CHECK(...).await?;
                  ...
                  $WRAPPER(...)
              - pattern-not-inside: |
                  let $AUTH = crate::commands::rbac::$CHECK(...).await?;
                  ...
                  $WRAPPER(...)
              - pattern-not-inside: |
                  authorize_office(...).await?;
                  ...
                  $WRAPPER(...)
              - pattern-not-inside: |
                  let $AUTH = authorize_office(...).await?;
                  ...
                  $WRAPPER(...)
              - pattern-not-inside: |
                  authorize_office(...).await.map_err(...)?;
                  ...
                  $WRAPPER(...)
              - pattern-not-inside: |
                  let $AUTH = authorize_office(...).await.map_err(...)?;
                  ...
                  $WRAPPER(...)
      - pattern-not-inside: |
          if $STATUS == "cancelled" {
            rbac::manager_or_owner(...).await?;
          } else {
            rbac::require_role(...).await?;
          }
          let $RESULT = delivery_repo::update_delivery_status(...).await?;
      - pattern-not: delivery_repo::update_delivery_status(&state.db, &input)
      - pattern-not-inside: |
          if $ELEVATED {
            rbac::manager_or_owner(...).await?;
          } else {
            rbac::require_any_role(...).await?;
          }
          ...
          delivery_repo::update_delivery_status(...)
      - pattern-not-inside: |
          if $OWNER != $ACTOR {
            rbac::manager_or_owner(...).await?;
          }
          ...
          if $SHIFT_DEVICE != $ACTIVE_DEVICE {
            rbac::owner_only(...).await?;
          }
          ...
          let $CLOSED = shift_repo::close_shift(...).await?;
      - pattern-not-inside: |
          let $AUTH = authorize_office(...).await?;
          ...
          $REPO::$METHOD(...)
      - pattern-not-inside: |
          let $AUTH = authorize_office(...).await.map_err(...)?;
          ...
          $REPO::$METHOD(...)
      - pattern-not: |
          ai_admin_repo::create_session(
            &state.db,
            &session_id,
            &input.branch_id,
            &input.user_id,
            &provider_name,
            &model_name,
          )
      - pattern-not: |
          ai_admin_repo::create_undo_record(
            &state.db,
            &input.action_id,
            &mutation_result.entity_type,
            &mutation_result.entity_id,
            &mutation_result.undo_snapshot_json,
            &mutation_result.rollback_tool,
            &mutation_result.rollback_input_json,
          )
      - pattern-not: ai_admin_repo::expire_old_actions(&state.db)
      - pattern-not: |
          ai_chat_history_repo::save_message(
            &state.db,
            &session_id,
            &input.branch_id,
            &input.user_id,
            "user",
            persisted_user_content,
            "text",
          )
      - pattern-not: ai_admin_repo::end_session(&state.db, &session_id, end_status)
      - pattern-not: |
          ai_chat_history_repo::save_message(
            &state.db,
            &session_id,
            &input.branch_id,
            &input.user_id,
            "assistant",
            text,
            "text",
          )
      - pattern-not: ai_admin_repo::end_session(&state.db, &session_id, "cancelled")
