rules:
  - id: zanpos-discarded-audit-security-result
    languages: [rust]
    severity: ERROR
    message: Audit and security writes must propagate their Result instead of discarding it.
    metadata:
      category: security
      technology: [rust, sqlx]
      baseline:
        structural_constraint: Only audit_ext, audit2, audit3, and create_refund are exempted by exact function name.
        rationale: The AI helpers await Workstream O's transaction-capable executor; create_refund aborts its already-open transaction on audit failure.
        owner: ZANPOS Maintainers
        review_by: '2027-01-31'
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    patterns:
      - pattern-regex: >-
          (?s)(?:let\s+_\s*=\s*|if\s+let\s+Err\s*\([^)]*\)\s*=\s*)?sqlx::query\(\s*"\s*INSERT\s+INTO\s+(?:audit_logs|security)[^"]*"\s*,?\s*\)(?:(?!;).)*?\.execute\([^)]*\)\s*\.await(?:\s*\.ok\(\)\s*;|\s*;|\s*\{)
      - pattern-not-inside: |
          async fn audit_ext(...) {
            ...
          }
      - pattern-not-inside: |
          async fn audit2(...) {
            ...
          }
      - pattern-not-inside: |
          async fn audit3(...) {
            ...
          }
      - pattern-not-inside: |
          pub async fn create_refund(...) {
            ...
          }

  - id: zanpos-no-dynamic-sql-format
    languages: [rust]
    mode: taint
    severity: ERROR
    message: Do not interpolate values into SQL; use a static query and bound parameters.
    metadata:
      category: security
      technology: [rust, sqlx]
      baseline:
        structural_constraint: Sanitizers are limited to explicit reject-and-return/continue identifier guards, named sync_v2 allowlist methods, Compiled Selector fragments in count/count_promotional/execute_price_adjust/execute_op, and migration_query_remote's reviewed read-only query.
        rationale: Function parameters, request fields, environment values, DB row reads, assignments, concatenation, and String builders are sources/propagators into SQLx sinks. Community Edition cannot correlate Rust format implicit-capture names or arbitrary interprocedural transforms; those finite boundaries are fixtures with this owned review date rather than broad sanitizers.
        owner: ZANPOS Maintainers
        review_by: '2027-01-31'
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    pattern-sources:
      - patterns:
          - pattern-inside: |
              fn $F(..., $INPUT: &$TYPE, ...) {
                ...
              }
          - pattern: $INPUT
          - metavariable-regex:
              metavariable: $TYPE
              regex: '(?:str|String)'
      - patterns:
          - pattern-inside: |
              fn $F(..., $INPUT: String, ...) {
                ...
              }
          - pattern: $INPUT
      - patterns:
          - pattern-inside: |
              fn $F(..., $INPUT: $TYPE, ...) {
                ...
              }
          - pattern-either:
              - pattern: $INPUT.$FIELD
              - pattern: $INPUT[$IDX]
      - patterns:
          - pattern-inside: |
              fn $F<$GENERIC>(..., $INPUT: $TYPE, ...) {
                ...
              }
          - pattern: $INPUT
      - patterns:
          - pattern-inside: |
              fn $F<$GENERIC: $BOUND>(..., $INPUT: $TYPE, ...) {
                ...
              }
          - pattern: $INPUT
      - pattern-either:
          - pattern: std::env::var(...)
          - pattern: std::env::var(...)?
          - pattern: std::env::var(...).unwrap_or_default()
          - pattern: std::env::var(...).unwrap_or(...)
          - pattern: std::env::var_os(...)
      - patterns:
          - pattern-inside: |
              fn $F(..., Path($INPUT): Path<$TYPE>, ...) {
                ...
              }
          - pattern: $INPUT
      - patterns:
          - pattern-inside: |
              fn $F(..., Query($INPUT): Query<$TYPE>, ...) {
                ...
              }
          - pattern: $INPUT
      - patterns:
          - pattern-inside: |
              fn $F(..., Json($INPUT): Json<$TYPE>, ...) {
                ...
              }
          - pattern: $INPUT
    pattern-sinks:
      - pattern-either:
          - pattern: sqlx::query($SQL)
          - pattern: sqlx::query::<$DB>($SQL)
          - pattern: sqlx::query_as($SQL)
          - pattern: sqlx::query_scalar($SQL)
          - pattern: sqlx::query_as::<$T>($SQL)
          - pattern: sqlx::query_scalar::<$T>($SQL)
          - pattern: sqlx::query_as::<$A, $B>($SQL)
          - pattern: sqlx::query_scalar::<$A, $B>($SQL)
          - pattern: sqlx::QueryBuilder::new($SQL)
          - pattern: sqlx::QueryBuilder::<$DB>::new($SQL)
      - patterns:
          - pattern-inside: |
              let mut $BUILDER = sqlx::QueryBuilder::new(...);
              ...
          - pattern: $BUILDER.push($SQL)
          - focus-metavariable: $SQL
      - patterns:
          - pattern-inside: |
              let mut $BUILDER = sqlx::QueryBuilder::<$DB>::new(...);
              ...
          - pattern: $BUILDER.push($SQL)
          - focus-metavariable: $SQL
    pattern-propagators:
      - pattern: $TO.push_str(&$FROM)
        from: $FROM
        to: $TO
      - pattern: $TO.push_str($FROM)
        from: $FROM
        to: $TO
      - pattern: $TO += $FROM
        from: $FROM
        to: $TO
      - pattern: |
          let $TO = format!($FMT, $NAME = $FROM, ...);
        from: $FROM
        to: $TO
    pattern-sanitizers:
      - patterns:
          - pattern-inside: |
              async fn mark_rows_synced(&self, $TABLE: &str, $ID: &str, ...) {
                ...
              }
          - pattern: $TABLE
      - patterns:
          - pattern-inside: |
              async fn increment_attempts(&self, $TABLE: &str, $ID: &str, ...) {
                ...
              }
          - pattern: $TABLE
      - patterns:
          - pattern-inside: |
              async fn mark_rows_synced(&self, $TABLE: &str, $ID: &str, ...) {
                ...
              }
          - pattern: $ID
      - patterns:
          - pattern-inside: |
              async fn increment_attempts(&self, $TABLE: &str, $ID: &str, ...) {
                ...
              }
          - pattern: $ID
      - patterns:
          - pattern-inside: |
              async fn mark_rows_synced(&self, $TABLE: &str, $ID: &str, ...) {
                ...
              }
          - pattern: $SQL
      - patterns:
          - pattern-inside: |
              pub async fn count_promotional(...) {
                ...
                let $COMPILED = $SELF.compile();
                ...
              }
          - pattern-either:
              - pattern: $COMPILED.cte
              - pattern: $COMPILED.where_sql
      - patterns:
          - pattern-inside: |
              pub async fn count(...) {
                ...
                let $COMPILED = $SELF.compile();
                ...
              }
          - pattern-either:
              - pattern: $COMPILED.cte
              - pattern: $COMPILED.where_sql
      - patterns:
          - pattern-inside: |
              pub async fn execute_price_adjust(...) {
                ...
                let $COMPILED = $SELF.compile();
                ...
              }
          - pattern-either:
              - pattern: $COMPILED.cte
              - pattern: $COMPILED.where_sql
      - patterns:
          - pattern-inside: |
              pub async fn execute_op(...) {
                ...
                let $COMPILED = $SELF.compile();
                ...
              }
          - pattern-either:
              - pattern: $COMPILED.cte
              - pattern: $COMPILED.where_sql
      - patterns:
          - pattern-inside: |
              pub async fn migration_query_remote(...) {
                ...
              }
          - pattern: limited_query

  - id: zanpos-no-db-derived-sql-format
    languages: [rust]
    severity: ERROR
    message: Do not build SQL text from a database row value; bind it as data instead.
    metadata:
      category: security
      technology: [rust, sqlx]
      baseline:
        structural_constraint: A get/try_get row value must be an explicit format argument or push_str input to the same let-bound SQL variable that reaches a SQLx sink.
        rationale: Treating every Row::get as a global taint source exceeded practical CE scan time. These finite same-function AST correlations cover direct and builder flows without marking unrelated row reads or internally formatted SQL.
        owner: ZANPOS Maintainers
        review_by: '2027-01-31'
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    pattern-either:
      - pattern: |
          let $VALUE: $TYPE = $ROW.try_get(...)?;
          ...
          let $SQL = format!($FMT, $VALUE, ...);
          ...
          sqlx::query_as::<$A, $B>(&$SQL)
      - pattern: |
          let $VALUE: $TYPE = $ROW.try_get(...)?;
          ...
          let mut $SQL = $INITIAL;
          ...
          $SQL.push_str(&$VALUE);
          ...
          sqlx::query_as::<$A, $B>(&$SQL)
      - pattern: |
          let $VALUE: $TYPE = $ROW.get(...);
          ...
          let $SQL = format!($FMT, $VALUE, ...);
          ...
          sqlx::query(&$SQL)
      - pattern: |
          let $VALUE: $TYPE = $ROW.get(...);
          ...
          let mut $SQL = $INITIAL;
          ...
          $SQL.push_str(&$VALUE);
          ...
          sqlx::query(&$SQL)

  - id: zanpos-no-secret-in-log-fields
    languages: [rust]
    severity: ERROR
    message: Do not send secret-like values to tracing fields.
    metadata:
      category: security
      technology: [rust, tracing]
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    patterns:
      - pattern-either:
          - pattern: tracing::trace!($FIELD = $VALUE, ...)
          - pattern: tracing::debug!($FIELD = $VALUE, ...)
          - pattern: tracing::info!($FIELD = $VALUE, ...)
          - pattern: tracing::warn!($FIELD = $VALUE, ...)
          - pattern: tracing::error!($FIELD = $VALUE, ...)
      - metavariable-regex:
          metavariable: $FIELD
          regex: '(?i).*(?:api[_-]?key|token|secret|password|passphrase|pin).*'

  - id: zanpos-no-secret-in-log-message
    languages: [rust]
    severity: ERROR
    message: Do not interpolate secret-like values into tracing messages.
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    pattern-regex: >-
      (?i)(?:tracing::)?(?:trace|debug|info|warn|error)!\([^\n]*\{[^}]*?(?:api[_-]?key|token|secret|password|passphrase|pin)[^}]*\}[^\n]*\)

  - id: zanpos-no-permissive-csp
    languages: [json]
    severity: ERROR
    message: Do not add wildcard CSP sources; use an explicit allowlist.
    metadata:
      category: security
      technology: [tauri, csp]
    paths:
      include:
        - /src-tauri/tauri.conf.json
        - /tests/security/semgrep/**/*.json
        - '**/semgrep/**/*.json'
    pattern-regex: '"csp"\s*:\s*"[^"]*(?:default-src|connect-src|script-src|img-src|media-src|style-src|font-src)[^"]*\s\*(?:\s|;|")'

  - id: zanpos-no-unsafe-csp-directive
    languages: [json]
    severity: ERROR
    message: Do not weaken CSP with unsafe script execution.
    paths:
      include:
        - /src-tauri/tauri.conf.json
        - /tests/security/semgrep/**/*.json
        - '**/semgrep/**/*.json'
    pattern-regex: '"csp"\s*:\s*"[^"]*script-src[^;]*unsafe-(?:inline|eval)'

  - id: zanpos-no-wildcard-network-endpoint
    languages: [rust]
    severity: ERROR
    message: Do not use wildcard network bind or endpoint literals in application code.
    metadata:
      baseline:
        structural_constraint: Only hub::lan_ips UDP probe binds are exempted.
        rationale: The UDP bind is local interface discovery; it does not expose a listener or accept traffic. String-literal wildcard binds are intentionally double-reported here and by zanpos-no-wildcard-listener-bind; both rules flag the same violation.
        owner: ZANPOS Maintainers
        review_by: '2027-01-31'
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    patterns:
      - pattern-regex: '"(?:https?://(?:\*|0\.0\.0\.0(?::\d+)?)|0\.0\.0\.0:\d+)'
      - pattern-not-inside: |
          pub fn lan_ips() -> Vec<String> {
            ...
          }

  - id: zanpos-no-wildcard-listener-bind
    languages: [rust]
    mode: taint
    severity: ERROR
    message: Do not bind a network listener to all interfaces without an explicit reviewed boundary.
    metadata:
      baseline:
        structural_constraint: Only SocketAddr::from(([0,0,0,0], port)) in hub::start_hub and UdpSocket::bind("0.0.0.0:0") in hub::lan_ips are sanitized; other values flow through variables, tuples, format!, constructors, and into() to static or instance bind sinks.
        rationale: start_hub is the authenticated shop-LAN hub boundary; lan_ips is a connected UDP discovery probe that never listens or accepts. Both exceptions are exact expressions in exact function names.
        owner: ZANPOS Maintainers
        review_by: '2027-01-31'
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    pattern-sources:
      - pattern-regex: '"0\.0\.0\.0(?::[^"\r\n]*)?"'
      - pattern: '[0, 0, 0, 0]'
      - patterns:
          - pattern: $IPV4::UNSPECIFIED
          - metavariable-regex:
              metavariable: $IPV4
              regex: '(?:std::net::)?Ipv4Addr'
    pattern-sinks:
      - pattern: $NETWORK_TYPE::bind($ADDRESS)
      - pattern: $SOCKET.bind($ADDRESS)
    pattern-sanitizers:
      - patterns:
          - pattern-inside: |
              pub async fn start_hub(...) {
                ...
              }
          - pattern: std::net::SocketAddr::from(([0, 0, 0, 0], $PORT))
      - patterns:
          - pattern-inside: |
              pub fn lan_ips() -> Vec<String> {
                ...
              }
          - pattern: '"0.0.0.0:0"'

  - id: zanpos-no-permissive-workflow-network
    languages: [yaml]
    severity: ERROR
    message: CI workflows must not disable TLS verification or use wildcard network endpoints.
    metadata:
      category: security
      baseline:
        structural_constraint: curl -k/--insecure is matched at any flag position; correlated shell, PowerShell, and GitHub env-variable references are matched within the same bounded workflow block. NODE_TLS_REJECT_UNAUTHORIZED covers direct and correlated-zero assignments.
        rationale: TLS verification bypasses and wildcard endpoints are always prohibited in CI. Variable-name backreferences prevent unrelated safe values from being treated as the insecure assignment.
        owner: ZANPOS Maintainers
        review_by: '2027-01-31'
    paths:
      include:
        - /.github/workflows/**/*.yml
        - /.github/workflows/**/*.yaml
        - /tests/security/semgrep/**/*.yml
        - '**/semgrep/**/*.yml'
    pattern-either:
      - pattern-regex: '(?i)(?:curl\b(?:[^\r\n\\]|\\\r?\n[ \t]*){0,500}?(?:\s-k\b|--insecure\b)|(?:set\s+|(?:\$\w+:|\$env:))?NODE_TLS_REJECT_UNAUTHORIZED\s*[:=]\s*["'']?0["'']?|https?://\*)'
      - pattern-regex: >-
          (?isx)(?:
            (?:set\s+|\$env:)?(?P<CURL_VAR>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*["']?(?:-k|--insecure)["']?.{0,500}?curl\b.{0,500}?(?:\$(?:\{(?P=CURL_VAR)\}|(?P=CURL_VAR)\b)|\$env:(?P=CURL_VAR)\b|\$\{\{\s*env\.(?P=CURL_VAR)\s*\}\})
            |
            (?:set\s+|\$env:)?(?P<TLS_VAR>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*["']?0["']?.{0,500}?NODE_TLS_REJECT_UNAUTHORIZED\s*[:=]\s*(?:\$(?:\{(?P=TLS_VAR)\}|(?P=TLS_VAR)\b)|\$env:(?P=TLS_VAR)\b|\$\{\{\s*env\.(?P=TLS_VAR)\s*\}\})
          )

  - id: zanpos-no-secret-log-shorthand
    languages: [rust]
    severity: ERROR
    message: Do not log secret-like shorthand or debug tracing fields.
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    pattern-regex: '(?i)(?:tracing::)?(?:trace|debug|info|warn|error)!\([^\n]*[?%](?:api[_-]?(?:key|token)|token|secret|password|passphrase|pin)\b[^\n]*\)'

  - id: zanpos-ai-mutation-needs-confirmation
    languages: [rust]
    severity: ERROR
    message: Tauri commands must dispatch AI mutations through execute_confirmed_mutation.
    metadata:
      category: security
      technology: [rust, tauri, ai]
      enforcement: execute_mutation_raw is pub(super); only the reviewed automatic-policy, confirmed-policy, and rollback dispatchers may call it.
    paths:
      include:
        - /src-tauri/src/ai/**/*.rs
        - /src-tauri/src/commands/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    patterns:
      - pattern-either:
          - pattern: crate::ai::tools::execute_mutation_raw(...)
          - pattern: execute_mutation_raw(...)
      - pattern-not-inside: |
          pub async fn execute_automatic_mutation(...) {
            ...
          }
      - pattern-not-inside: |
          pub async fn execute_confirmed_mutation(...) {
            ...
          }
      - pattern-not-inside: |
          pub(super) async fn execute_undo_raw(...) {
            ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod tests {
            ...
          }

  - id: zanpos-no-raw-mutation-import-alias
    languages: [rust]
    severity: ERROR
    message: Do not import or alias the raw AI mutation executor outside tool_policy.
    paths:
      include:
        - /src-tauri/src/**/*.rs
        - /tests/security/semgrep/**/*.rs
        - '**/semgrep/**/*.rs'
    patterns:
      - pattern: use crate::ai::tools::execute_mutation_raw as $ALIAS;
      - pattern-not-inside: |
          mod tool_policy {
            ...
          }
