# cargo-nextest configuration for ZANPOS
#
# Test parity (2026-08-02):
#   cargo nextest --all-targets: covers every test except doc-tests
#   cargo test --doc:            retained separately (nextest does not run them)
#   CI runs nextest for the JUnit report, plus the doc-test step. It used to run
#   `cargo test --all-targets` as well, over the identical set; that duplicate
#   was removed once it started pushing the job past its timeout.
#   No generic retry policy: flaky tests addressed individually at source

[profile.default]
slow-timeout = { period = "30s", terminate-after = 3 }
leak-timeout = "2s"

[profile.ci]
# Report at 30s so slowness stays visible; kill only at 600s.
#
# The kill threshold is there to name which test hung, not to police speed —
# the job's own 90-minute timeout is the real backstop. Sizing it near observed
# runtimes turned it into a speed limit on a machine whose speed varies wildly:
# it was 60s (killed a healthy heartbeat test at 60.05s), then 180s (killed a
# hub-sync test at 180.17s on a run where the whole suite took 2325s against
# 240s locally, with 33 tests reported slow rather than the usual 3).
#
# A hang is unbounded, so 600s separates it from any real test on any runner,
# while a genuinely slow test still shows up in the 30s slow report.
slow-timeout = { period = "30s", terminate-after = 20 }
leak-timeout = "2s"

# JUnit output for CI artifact publication.
#
# Relative to nextest's store directory for this profile, which is already
# `target/nextest/ci/`. Naming the file "ci/junit.xml" put it at
# target/nextest/ci/ci/junit.xml, one level below where the workflow's
# upload step looks, so the artifact step failed with "no files found" every
# time it was reached.
[profile.ci.junit]
path = "junit.xml"
report-name = "zanpos-test-report"
store-success-output = false
store-failure-output = true
