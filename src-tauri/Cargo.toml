[package]
name = "zanpos"
version = "2.0.0"
description = "ZANPOS — Local-first offline-capable retail POS for Windows"
authors = ["ZANPOS Contributors"]
edition = "2021"
# Minimum Rust version enforced in CI (dtolnay/rust-toolchain@stable tracks this)
rust-version = "1.77"

[lib]
name = "zanpos_lib"
# staticlib removed — unnecessary for Tauri; adds ~10% build time (L17)
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }

# IDs
ulid = { version = "1", features = ["serde"] }

# Exact decimal arithmetic (H9/H10)
rust_decimal = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# File logging (OBS-01): rolling daily log in the app data dir so field issues
# (especially sync failures) are diagnosable without a dev console.
tracing-appender = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for AI API + streaming
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# Password hashing
argon2 = { version = "0.5", features = ["rand"] }
rand = { version = "0.8", features = ["getrandom"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Serial port for ESC/POS thermal printing
serialport = "4"

# Windows-only: raw print spooler API (winspool.drv) for USB/GDI printers.
#
# F-MED-08 / L18 — Decision: KEEP winapi 0.3 (accepted, documented).
#   winapi is a *binding-only* crate: it declares the extern signatures for 6
#   winspool functions (OpenPrinterW, StartDocPrinterW, WritePrinter, etc.). The
#   executable code lives in Windows itself (winspool.drv), so "unmaintained
#   binding" carries no runtime attack surface the way an unmaintained logic crate
#   would. Migrating to the official `windows` crate would pull in a very large
#   dependency (substantial build-time + binary-size cost) to replace 6 stable FFI
#   declarations, and would rewrite a working hardware-I/O path — real regression
#   risk for zero functional gain. Re-evaluate only if winapi breaks on a future
#   Rust/Windows toolchain.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winspool", "minwindef", "winnt", "errhandlingapi"] }

# Hash / HMAC for audit chain
sha2 = "0.10"
hex = "0.4"

# PDF receipt generation (WhatsApp PDF send — uses built-in Type1 fonts, no file deps)
printpdf = "0.7"
base64 = "0.22"

# Secure credential storage (Windows Credential Manager by default on Windows)
keyring = "2"

# AI migration agent dependencies
mysql      = "25"
tiberius   = { version = "0.12", default-features = false, features = ["tokio", "native-tls"] }
calamine   = "0.24"
csv        = "1.3"
tokio-util = { version = "0.7", features = ["compat"] }
zip        = "2"

# ── Release profile optimisations (H10) ──────────────────────────────────────
# lto=fat: cross-crate inlining → smaller, faster binary (~30-50% size reduction)
# codegen-units=1: single codegen unit enables maximum optimisation
# strip=symbols: removes debug symbols from release binary
# opt-level=s: optimise for size (better than "3" for desktop POS binaries)
[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
opt-level     = "s"
