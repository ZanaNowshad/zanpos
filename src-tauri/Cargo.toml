[package]
name = "zanpos"
version = "2.0.1"
description = "ZANPOS — Local-first offline-capable retail POS for Windows"
authors = ["ZANPOS Contributors"]
publish = false
edition = "2021"
# Minimum Rust version enforced in CI (dtolnay/rust-toolchain@stable tracks this)
rust-version = "1.77"

[lib]
name = "zanpos_lib"
# staticlib removed — unnecessary for Tauri; adds ~10% build time (L17)
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# A second launch must focus the running window, never start a rival instance:
# two processes on one machine share a device_id, a receipt counter and a SQLite
# file, and the newcomer's startup taskkills the first one's WhatsApp sidecar.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }

# IDs
ulid = { version = "1", features = ["serde"] }

# Exact decimal arithmetic (H9/H10)
rust_decimal = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# File logging (OBS-01): rolling daily log in the app data dir so field issues
# (especially sync failures) are diagnosable without a dev console.
tracing-appender = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for AI API + streaming
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# Embedded LAN hub server (PostgREST-subset over the local SQLite)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

# Password hashing
argon2 = { version = "0.5", features = ["rand"] }
rand = { version = "0.8", features = ["getrandom"] }

# Offline license signature verification (src/license.rs). Separate trust
# domain from the updater's minisign key — see that module's docs.
ed25519-dalek = "2"

# Authenticated encryption for off-site DB backups (src/backup.rs). XChaCha20
# gives a 192-bit nonce, so random nonces are safe without a counter to persist.
chacha20poly1305 = "0.10"

# Error handling
thiserror = "1"
anyhow = "1.0.103"

# Serial port for ESC/POS thermal printing
serialport = "4"

# Windows-only: raw print spooler API (winspool.drv) for USB/GDI printers.
#
# F-MED-08 / L18 — Decision: KEEP winapi 0.3 (accepted, documented).
#   winapi is a *binding-only* crate: it declares the extern signatures for 6
#   winspool functions (OpenPrinterW, StartDocPrinterW, WritePrinter, etc.). The
#   executable code lives in Windows itself (winspool.drv), so "unmaintained
#   binding" carries no runtime attack surface the way an unmaintained logic crate
#   would. Migrating to the official `windows` crate would pull in a very large
#   dependency (substantial build-time + binary-size cost) to replace 6 stable FFI
#   declarations, and would rewrite a working hardware-I/O path — real regression
#   risk for zero functional gain. Re-evaluate only if winapi breaks on a future
#   Rust/Windows toolchain.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winspool", "minwindef", "winnt", "errhandlingapi", "jobapi2", "processthreadsapi", "handleapi"] }

# Hash / HMAC for audit chain
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

base64 = "0.22"

# Secure credential storage (Windows Credential Manager by default on Windows)
keyring = "2"

# AI migration agent dependencies
mysql      = "28"
tiberius   = { version = "0.12", default-features = false, features = ["tokio", "native-tls"] }
calamine   = "0.36"
csv        = "1.3"
tokio-util = { version = "0.7", features = ["compat"] }
zip        = "2"

# ── Printer: escpos-rs with legacy fallback ──────────────────────────────────
escpos = { version = "0.6", features = ["graphics"], optional = true }
rustybuzz = { version = "0.18", optional = true }
parley = { version = "0.2", optional = true }
font-kit = { version = "0.14", optional = true }
mdns-sd = { version = "0.11", optional = true }
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", optional = true }
rig-core = { version = "0.8", optional = true }

[features]
default = []
legacy-printer = []
escpos-driver = ["escpos"]
arabic-rendering = ["escpos", "rustybuzz", "parley", "font-kit"]
mdns-discovery = ["mdns-sd"]
otel-tracing = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]
rig-pilot = ["rig-core"]

# ── Release profile optimisations (H10) ──────────────────────────────────────
# lto=fat: cross-crate inlining → smaller, faster binary (~30-50% size reduction)
# codegen-units=1: single codegen unit enables maximum optimisation
# strip=symbols: removes debug symbols from release binary
# opt-level=s: optimise for size (better than "3" for desktop POS binaries)
[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
opt-level     = "s"
