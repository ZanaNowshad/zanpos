[package]
name = "zanpos"
version = "0.1.0"
description = "ZANPOS — Local-first offline-capable retail POS for Windows"
authors = ["ZANPOS Contributors"]
edition = "2021"
# Minimum Rust version enforced in CI (dtolnay/rust-toolchain@stable tracks this)
rust-version = "1.77"

[lib]
name = "zanpos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }

# IDs
ulid = { version = "1", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for AI API + streaming
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# Password hashing
argon2 = { version = "0.5", features = ["rand"] }
rand = { version = "0.8", features = ["getrandom"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Serial port for ESC/POS thermal printing
serialport = "4"

# Hash / HMAC for audit chain
sha2 = "0.10"
hex = "0.4"

# Secure credential storage (Windows Credential Manager by default on Windows)
keyring = "2"

# AI migration agent dependencies
mysql      = "25"
tiberius   = { version = "0.12", default-features = false, features = ["tokio", "vendored-openssl"] }
calamine   = "0.24"
csv        = "1.3"
tokio-util = { version = "0.7", features = ["compat"] }
